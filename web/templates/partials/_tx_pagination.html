{{ define "tx_pagination_oob" }}
<div id="tx-pagination" hx-swap-oob="true" class="tx-pagination">
  {{ if .Pagination.ShowPrev }}
  <button class="tx-btn tx-btn--ghost" type="button"
          hx-get="/app/transactions/table"
          hx-target="#tx-tbody"
          hx-select="tr"
          hx-swap="innerHTML"
          hx-include="#tx-filters"
          hx-vals='{"offset":{{ .Pagination.PrevOffset }} }'
          hx-push-url="true">Prev</button>
  {{ end }}

  <span class="tx-pagination-info">{{ .Pagination.Info }}</span>

  {{ if .Pagination.ShowNext }}
  <button class="tx-btn tx-btn--ghost" type="button"
          hx-get="/app/transactions/table"
          hx-target="#tx-tbody"
          hx-select="tr"
          hx-swap="innerHTML"
          hx-include="#tx-filters"
          hx-vals='{"offset":{{ .Pagination.NextOffset }} }'
          hx-push-url="true">Next</button>
  {{ end }}
</div>
{{ end }}
