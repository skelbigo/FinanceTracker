{{ define "tx_row_edit_response" }}
<table style="display:none"><tbody>
{{ template "tx_row_edit" . }}
</tbody></table>
{{ end }}

{{ define "tx_row_edit" }}
<tr id="tx-{{ .Row.ID }}">
  <td class="tx-td-date"><input class="tx-control" form="tx-edit-form-{{ .Row.ID }}" name="occurred_at" type="date" value="{{ .Row.Occurred }}" required></td>
  <td>
    <select class="tx-control tx-control--select" form="tx-edit-form-{{ .Row.ID }}" name="type" required>
      <option value="income" {{ if eq .Row.Type "income" }}selected{{ end }}>Income</option>
      <option value="expense" {{ if eq .Row.Type "expense" }}selected{{ end }}>Expense</option>
    </select>
  </td>
  <td>
    <select class="tx-control tx-control--select" form="tx-edit-form-{{ .Row.ID }}" name="category_id">
      <option value="">No category</option>
      {{ range .Categories }}
      <option value="{{ .ID }}" {{ if eq $.Row.CategoryID .ID }}selected{{ end }}>{{ .Name }}</option>
      {{ end }}
    </select>
  </td>
  <td>
    <div class="tx-amount-inline">
      <input class="tx-control tx-control--sm" form="tx-edit-form-{{ .Row.ID }}" name="amount" type="text" value="{{ .Row.Amount }}" required>
      <input class="tx-control tx-control--xs" form="tx-edit-form-{{ .Row.ID }}" name="currency" type="text" value="{{ .Row.Currency }}" maxlength="3" required>
    </div>
  </td>
  <td>
    <input class="tx-control tx-control--note" form="tx-edit-form-{{ .Row.ID }}" name="note" type="text" value="{{ .Row.Note }}" placeholder="Note">
    <div class="tx-row-sub">
      <input class="tx-control tx-control--tags" form="tx-edit-form-{{ .Row.ID }}" name="tags" type="text" value="{{ .Row.Tags }}" placeholder="tag1, tag2">
    </div>
  </td>
  <td class="tx-td-actions">
    <form id="tx-edit-form-{{ .Row.ID }}"
          hx-post="/app/transactions/{{ .Row.ID }}/update"
          hx-target="closest tr"
          hx-select="tr"
          hx-swap="outerHTML"
          method="post"
          class="tx-edit-actions">
      <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
      <button class="tx-btn tx-btn--primary" type="submit">Save</button>
      <button class="tx-btn tx-btn--ghost" type="button"
              hx-get="/app/transactions/table"
              hx-target="#tx-tbody"
              hx-select="tr"
              hx-swap="innerHTML"
              hx-include="#tx-filters">Cancel</button>
    </form>
  </td>
</tr>
{{ end }}
