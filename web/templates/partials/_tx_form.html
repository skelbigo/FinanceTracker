{{ define "tx_form" }}
<form id="tx-form"
      method="post"
      hx-post="/app/transactions"
      hx-target="#tx-tbody"
      hx-select="tr"
      hx-swap="afterbegin">

  <input type="hidden" name="csrf_token" value="{{ .CSRF }}">

  <div class="tx-bar" role="group" aria-label="Add transaction">
    <select class="tx-control tx-control--select" name="type" required>
      <option value="">Type</option>
      <option value="income">Income</option>
      <option value="expense">Expense</option>
    </select>

    <input class="tx-control" name="amount" type="text" inputmode="decimal"
           pattern="^[0-9]+([\.,][0-9]{1,2})?$"
           placeholder="Amount (e.g. 12.34)" required>

    <input class="tx-control tx-control--xs" name="currency" value="{{ .DefaultCurrency }}" maxlength="3" required>

    <input class="tx-control" name="occurred_at" type="date" required>

    <select class="tx-control tx-control--select" name="category_id">
      <option value="">No category</option>
      {{ range .Categories }}
      <option value="{{ .ID }}">{{ .Name }}</option>
      {{ end }}
    </select>

    <input class="tx-control tx-control--tags" name="tags" placeholder="tag1, tag2">
    <input class="tx-control tx-control--note" name="note" placeholder="Note">

    <button class="tx-btn tx-btn--primary" type="submit">Add</button>
  </div>
</form>

{{ end }}
