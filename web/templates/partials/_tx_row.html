{{ define "tx_row" }}
<tr id="tx-{{ .ID }}">
  <td class="tx-td-date">{{ .Occurred }}</td>
  <td class="tx-td-type">{{ .Type }}</td>
  <td class="tx-td-category">{{ .Category }}</td>
  <td class="tx-td-amount">{{ .Amount }} <span class="tx-currency">{{ .Currency }}</span></td>
  <td class="tx-td-note">
    {{ if .Note }}<div class="tx-note">{{ .Note }}</div>{{ else }}<span class="tx-muted">—</span>{{ end }}
    {{ if .Tags }}<div class="tx-tags">{{ .Tags }}</div>{{ end }}
  </td>
  <td class="tx-td-actions">
    <div class="tx-edit-actions">
      <button class="tx-btn tx-btn--primary" type="button"
              hx-get="/app/transactions/{{ .ID }}/edit"
              hx-target="closest tr"
              hx-swap="outerHTML">
        Edit
      </button>

      <form class="tx-action-form"
            hx-post="/app/transactions/{{ .ID }}/delete"
            hx-target="closest tr"
            hx-swap="outerHTML"
            hx-confirm="Delete this transaction?"
            method="post">
        <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
        <button class="tx-btn tx-btn--danger" type="submit">Delete</button>
      </form>
    </div>
  </td>

</tr>
{{ end }}
