{{ define "layout" }}
<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="/static/app.js" defer></script>
</head>
<body class="{{ .BodyClass }}" hx-headers='{"X-CSRF-Token":"{{ .CSRF }}"}'>
{{ if not .HideHeader }}
<header class="app-header">
    <div class="app-header-inner">
        <a class="app-brand" href="/app" aria-label="Finance Tracker">
            <svg class="app-brand-mark" width="40" height="40" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <defs>
                    <linearGradient id="g" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#00D2C6" />
                        <stop offset="1" stop-color="#20F2C8" />
                    </linearGradient>
                </defs>
                <rect x="6" y="8" width="22" height="10" rx="5" fill="url(#g)" opacity="0.95"/>
                <rect x="6" y="18" width="28" height="10" rx="5" fill="url(#g)" opacity="0.85"/>
                <rect x="6" y="28" width="18" height="10" rx="5" fill="url(#g)" opacity="0.75"/>
            </svg>
            <span class="app-brand-title">
            <span class="app-brand-title-top">Finance</span>
            <span class="app-brand-title-bottom">Tracker</span>
          </span>
        </a>

        <div class="app-header-center">
            <nav class="app-nav" aria-label="Primary">
                <a class="app-nav-link" href="/app/workspaces">Workspaces</a>
            </nav>

            <div class="ws-switcher">
                {{ if or .HeaderWorkspaces .Items }}
                <form class="ws-switcher-form" action="/app/workspaces/select" method="post">
                    <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
                    <input type="hidden" name="return_to" value="{{ if .ReturnTo }}{{ .ReturnTo }}{{ end }}">

                    <label class="ws-switcher-kicker" for="ws-switcher-select">Workspace</label>
                    <select id="ws-switcher-select" class="ws-switcher-select" name="workspace_id" onchange="this.form.submit()">
                        {{ if .HeaderWorkspaces }}
                        {{ range .HeaderWorkspaces }}
                        <option value="{{ .ID }}" {{ if or (and $.HeaderWorkspaceID (eq .ID $.HeaderWorkspaceID)) (and $.CurrentID (eq .ID $.CurrentID)) }}selected{{ end }}>{{ .Name }}{{ if .Role }} ({{ .Role }}){{ end }}</option>
                        {{ end }}
                        {{ else }}
                        {{ range .Items }}
                        <option value="{{ .ID }}" {{ if or (and $.HeaderWorkspaceID (eq .ID $.HeaderWorkspaceID)) (and $.CurrentID (eq .ID $.CurrentID)) }}selected{{ end }}>{{ .Name }} ({{ .Role }})</option>
                        {{ end }}
                        {{ end }}
                    </select>
                </form>
                {{ else }}
                {{ with .Workspace }}
                <div class="ws-switcher-readonly" title="Active workspace">{{ .Name }}</div>
                {{ end }}
                {{ end }}
            </div>
        </div>

        <form class="app-logout" action="/logout" method="post">
            <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
            <button class="app-logout-btn" type="submit">Logout</button>
        </form>
    </div>
</header>
{{ end }}

<main class="{{ if .MainClass }}{{ .MainClass }}{{ else }}app-main{{ end }}">
    {{ template "flash" . }}
    {{ template "content" . }}
</main>
</body>
</html>
{{ end }}
