{{ define "content" }}
<section class="tx-wrap" aria-label="Budgets">
  <div class="tx-nav">
    <a class="tx-link" href="/app/transactions">← Back to Transactions</a>
  </div>

  <h1 class="tx-title">Budgets</h1>

  <div id="budget-errors" class="tx-errors"></div>

  <div class="tx-block tx-block--form">
    <form id="budget-create"
          method="post"
          hx-post="/app/budgets"
          hx-target="#budget-tbody"
          hx-select="#budget-fragment tr"
          hx-select-oob="#budget-errors,#budget-empty"
          hx-swap="beforeend">

      <input type="hidden" name="csrf_token" value="{{ .CSRF }}">

      <div class="tx-bar" role="group" aria-label="Add budget">
        <select class="tx-control tx-control--select" name="category_id" required>
          <option value="">Category</option>
          {{ range .Categories }}
          <option value="{{ .ID }}">{{ .Name }}</option>
          {{ end }}
        </select>

        <select class="tx-control tx-control--select" name="period" required>
          <option value="month">Month</option>
          <option value="week">Week</option>
        </select>

        <input class="tx-control" name="limit" type="text" inputmode="decimal"
               pattern="^[0-9]+([\.,][0-9]{1,2})?$"
               placeholder="Limit (e.g. 200.00)" required>

        <input class="tx-control tx-control--xs" name="currency" value="{{ .DefaultCurrency }}" maxlength="3" required>

        <button class="tx-btn tx-btn--primary" type="submit">Add</button>
      </div>
    </form>
  </div>

  <div class="tx-table-wrap" role="region" aria-label="Budgets table" tabindex="0">
    <table class="tx-table">
      <thead>
      <tr>
        <th scope="col">Category</th>
        <th scope="col">Period</th>
        <th scope="col" class="tx-th-amount">Limit</th>
        <th scope="col" class="tx-th-amount">Spent</th>
        <th scope="col" class="tx-th-amount">Remaining</th>
        <th scope="col">Progress</th>
        <th scope="col">Status</th>
        <th scope="col" class="tx-th-actions">Actions</th>
      </tr>
      </thead>

      <tbody id="budget-tbody">
      {{ range .Budgets }}
      {{ template "budget_row" . }}
      {{ else }}
      <tr id="budget-empty"><td colspan="8">No budgets</td></tr>
      {{ end }}
      </tbody>
    </table>
  </div>
</section>
{{ end }}
