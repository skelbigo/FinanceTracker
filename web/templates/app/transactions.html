{{ define "content" }}
<section class="tx-wrap" aria-label="Transactions">
  <div class="tx-nav">
    <a class="tx-link" href="/app">← Back to Dashboard</a>
  </div>

  <h1 class="tx-title">Transactions</h1>

  <div id="tx-form-errors" class="tx-errors"></div>

  <div class="tx-block tx-block--form">
    {{ template "tx_form" . }}
  </div>

  <div class="tx-between">
    <a class="tx-link" href="/app/categories">Create categories</a>
  </div>

  <div class="tx-block tx-block--filters">
    <div class="tx-block-title">Filters and search</div>
    {{ template "tx_filters" . }}
  </div>

  <div class="tx-table-wrap" role="region" aria-label="Transactions table" tabindex="0">
    <table class="tx-table">
      <thead>
      <tr>
        <th scope="col">Date</th>
        <th scope="col">Type</th>
        <th scope="col">Category</th>
        <th scope="col" class="tx-th-amount">Amount</th>
        <th scope="col">Note</th>
        <th scope="col" class="tx-th-actions">Actions</th>
      </tr>
      </thead>

      <tbody id="tx-tbody"
             hx-get="/app/transactions/table"
             hx-trigger="load, tx-filters-changed from:body"
             hx-include="#tx-filters"
             hx-target="this"
             hx-select="tr"
             hx-swap="innerHTML">
      {{/* HTMX will load rows */}}
      </tbody>
    </table>
  </div>

  <div id="tx-pagination" class="tx-pagination"></div>
</section>
{{ end }}
