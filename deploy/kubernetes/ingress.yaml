apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: financetracker
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "86400"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "false"
    nginx.ingress.kubernetes.io/hsts-preload: "false"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - financetracker.example.com
      secretName: financetracker-tls
  rules:
    - host: financetracker.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: financetracker-api
                port:
                  number: 8080
